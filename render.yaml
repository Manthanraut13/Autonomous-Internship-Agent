# render.yaml — Declarative deployment configuration for Render
# Docs: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: internship-agent
    runtime: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DISABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false  # Must be set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: USER_WHATSAPP_NUMBER
        sync: false
      - key: MATCH_SCORE_THRESHOLD
        value: "70"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
