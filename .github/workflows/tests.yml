name: Tests

# Runs the offline pytest suite on every push/PR so regressions are caught
# before the scheduled 9AM/9PM pipeline runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions (same posture as cron_pipeline.yml)
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # config/settings.py requires these at import; tests never call the
      # real services (all external seams are monkeypatched).
      GROQ_API_KEY: ci-dummy-key
      TWILIO_ACCOUNT_SID: ci-dummy-sid
      TWILIO_AUTH_TOKEN: ci-dummy-token
      TWILIO_PHONE_NUMBER: "+15550000000"
      USER_WHATSAPP_NUMBER: "+15550000001"
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'   # matches Render (PYTHON_VERSION 3.11.9)
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Tests
        run: python -m pytest tests/ -v
