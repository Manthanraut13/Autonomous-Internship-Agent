name: 9 AM & 9 PM Daily Internship Pipeline

on:
  schedule:
    # 9:00 AM IST (03:30 UTC)
    - cron: '30 3 * * *'
    # 9:00 PM IST (15:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual run button from GitHub Actions UI

# Least-privilege permissions (vuln-0004 hardening)
permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Token and Credentials Files
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          if [ -n "$GMAIL_CREDENTIALS" ]; then
            echo "$GMAIL_CREDENTIALS" > credentials.json
          fi
          if [ -n "$GMAIL_TOKEN" ]; then
            echo "$GMAIL_TOKEN" > token.json
          fi

      - name: Wake up Render Web Service (Optional)
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -n "$RENDER_APP_URL" ]; then
            echo "Pinging Render to wake up service: $RENDER_APP_URL"
            curl -s "$RENDER_APP_URL/dashboard" > /dev/null || true
          fi

      - name: Run 25-Target Internship Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/agent.db' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          USER_WHATSAPP_NUMBER: ${{ secrets.USER_WHATSAPP_NUMBER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          MATCH_SCORE_THRESHOLD: 70
        run: |
          python run_pipeline.py --target 25 --threshold 70

